[project]
name = "thinktrace-backend"
version = "0.1.0"
description = "FastAPI backend of my app ThinkTrace"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
    "sqlalchemy==2.0.52",
    "asyncpg==0.31.0",
    "psycopg[binary]==3.3.4",
    "alembic==1.19.1",
    "pydantic-settings==2.15.0",
    "pyjwt==2.13.0",
    "pwdlib==0.3.1",
    "argon2-cffi==25.1.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "testcontainers==4.15.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"